name: Sync rollspel.nu -> archive.json

on:
  schedule:
    - cron: "3,33 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-archive
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Cacha pip (inte data/)
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch forum changes
        run: |
          python fetch_varulvsspel.py --output data --limit-threads 5 --delay 1.25

      - name: Build archive.json (changed-only)
        run: |
          python build_archive.py --data data --out archive.json

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Lägg till både data/ och archive.json
          git add -A data archive.json

          # Inget att committa? Avsluta.
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update data and archive.json"

          # Skydda mot race om två runs hinner nära varandra
          git pull --rebase
          git push
