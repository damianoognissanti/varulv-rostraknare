name: Sync rollspel.nu -> archive.json

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-archive
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data
          key: data-cache-v1-${{ github.run_id }}
          restore-keys: |
            data-cache-v1-

      - name: Fetch forum changes
        run: |
          python fetch_varulvsspel.py --limit-threads 5 --delay 1.25

      - name: Build archive.json (changed-only)
        run: |
          python build_archive.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- archive.json; then
            echo "No changes in archive.json"
            exit 0
          fi

          git add archive.json
          git commit -m "Update archive.json"
          git push
